# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      # >= 0.165.0: fixes CVE-2026-89258 (symlink confinement bypass) and
      # CVE-2026-89259 (tailwindcss in default security.exec.allow).
      # Requires PaperMod >= the refreshed-template-system fix (submodule pin).
      HUGO_VERSION: 0.166.0
      # sha256 of hugo_extended_${HUGO_VERSION}_linux-amd64.deb from
      # https://github.com/gohugoio/hugo/releases — re-verify when bumping HUGO_VERSION.
      HUGO_DEB_SHA256: 52b06555f739b1a08e04f5c31296e9bdf166a012e9b7e3137befc889dbc24db8 # pragma: allowlist secret
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && echo "${HUGO_DEB_SHA256}  ${{ runner.temp }}/hugo.deb" | sha256sum --check \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Reject symlinks (CVE-2026-89258)
        # Hugo resource lookups (resources.Get, os.ReadFile) follow symlinks;
        # a symlink planted in the checkout (e.g. in themes/) could leak files
        # outside the project into the generated site. pre-commit's
        # check-symlinks is bypassable (--no-verify), so enforce it in CI.
        run: |
          if find . -path ./.git -prune -o -type l -print | grep -q .; then
            echo "::error::Symbolic links present in the checkout — refusing to build (CVE-2026-89258)."
            exit 1
          fi
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
